[project]
name = "anamnesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "tests/contract/*" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["anamnesis"]
